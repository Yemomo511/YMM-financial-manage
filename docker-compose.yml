services:
  postgres:
    image: postgres:16-alpine
    container_name: ymm-financial-postgres
    environment:
      POSTGRES_USER: ymm
      POSTGRES_PASSWORD: ymm
      POSTGRES_DB: ymm_financial_manage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ymm-financial-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
