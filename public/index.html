<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A 股实时行情看板</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #202733;
        --muted: #667085;
        --border: #d9dee7;
        --accent: #12715b;
        --danger: #ba1a1a;
        --shadow: 0 16px 40px rgba(29, 41, 57, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 128px;
        font-size: 14px;
        color: var(--muted);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #98a2b3;
      }

      .dot.connected {
        background: var(--accent);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 16px;
        margin-bottom: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      input,
      button {
        min-height: 40px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        padding: 0 12px;
      }

      button {
        border: 0;
        padding: 0 16px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }

      .table-wrap {
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 860px;
      }

      th,
      td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        text-align: right;
        font-size: 14px;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child,
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }

      th {
        background: #eef2f6;
        color: var(--muted);
        font-weight: 600;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .up {
        color: var(--danger);
        font-weight: 700;
      }

      .down {
        color: var(--accent);
        font-weight: 700;
      }

      .empty {
        padding: 36px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 720px) {
        main {
          width: min(100vw - 20px, 1180px);
          padding: 20px 0;
        }

        header,
        .toolbar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        header {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>A 股实时行情看板</h1>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">连接中</span></div>
      </header>

      <section class="toolbar" aria-label="订阅设置">
        <input id="symbolsInput" value="600519.SH,000001.SZ" aria-label="股票代码" />
        <button id="subscribeButton" type="button">订阅</button>
      </section>

      <section class="table-wrap" aria-label="实时行情">
        <table>
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>最新价</th>
              <th>涨跌额</th>
              <th>涨跌幅</th>
              <th>成交量</th>
              <th>Trace ID</th>
              <th>推送时间</th>
            </tr>
          </thead>
          <tbody id="quoteBody">
            <tr>
              <td class="empty" colspan="8">等待实时行情推送</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      const quotes = new Map();
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const symbolsInput = document.getElementById('symbolsInput');
      const quoteBody = document.getElementById('quoteBody');
      let socket;

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/ws/market`);
        socket.addEventListener('open', () => {
          statusDot.classList.add('connected');
          statusText.textContent = '已连接';
          subscribe();
        });
        socket.addEventListener('close', () => {
          statusDot.classList.remove('connected');
          statusText.textContent = '已断开，重连中';
          setTimeout(connect, 1500);
        });
        socket.addEventListener('message', (event) => {
          const envelope = JSON.parse(event.data);
          if (envelope.topic !== 'market.stock.tick') return;
          quotes.set(envelope.symbol, envelope);
          renderQuotes();
        });
      }

      function subscribe() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        const symbols = symbolsInput.value.split(',').map((item) => item.trim()).filter(Boolean);
        socket.send(JSON.stringify({
          type: 'subscribe',
          topics: ['market.stock.tick'],
          symbols,
        }));
      }

      function renderQuotes() {
        const rows = Array.from(quotes.values()).sort((left, right) => left.symbol.localeCompare(right.symbol));
        quoteBody.innerHTML = rows.map((quote) => {
          const payload = quote.payload;
          const direction = payload.changeAmount >= 0 ? 'up' : 'down';
          return `
            <tr>
              <td>${quote.symbol}</td>
              <td>${payload.name ?? quote.symbol}</td>
              <td>${payload.lastPrice.toFixed(2)}</td>
              <td class="${direction}">${payload.changeAmount.toFixed(2)}</td>
              <td class="${direction}">${payload.changePercent.toFixed(3)}%</td>
              <td>${payload.volume.toLocaleString('zh-CN')}</td>
              <td>${quote.traceId}</td>
              <td>${new Date(quote.publishedAt).toLocaleTimeString('zh-CN')}</td>
            </tr>
          `;
        }).join('');
      }

      document.getElementById('subscribeButton').addEventListener('click', subscribe);
      connect();
    </script>
  </body>
</html>
